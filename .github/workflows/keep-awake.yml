# Keeps the free Render service awake, so visitors never see Render's "service waking up" page.
# Render's free plan sleeps after 15 minutes without traffic; this pings every 5 minutes, so even one
# skipped scheduled run (GitHub may drop some) leaves a 10-minute gap, still under the 15-minute limit.
# It runs at :02, :07, :12 ... to avoid the busy start of each hour.
#
# It fetches a small static file on purpose, NOT /api/v1/health: the health check queries the database,
# and pinging it would keep the free Neon database awake around the clock and use up its monthly compute hours.
# Static files without a login cookie never touch the database.
#
# One service awake all month uses about 744 of Render's 750 free hours, so this only fits one free service.
# GitHub may delay scheduled runs by a few minutes at busy times; that is fine for this purpose.
name: Keep site awake

on:
  schedule:
    - cron: "2-59/5 * * * *"
  workflow_dispatch:

permissions: {}

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Ping the site
        run: curl --fail --silent --show-error --retry 3 --retry-delay 20 --max-time 90 -o /dev/null -w "HTTP %{http_code} in %{time_total}s\n" https://beyond-borders-tj8b.onrender.com/theme-init.js
